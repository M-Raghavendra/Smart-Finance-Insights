<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Finance Insights</title>

    <script>
        (function() {
            var localTheme = localStorage.getItem('finsight_theme');
            var theme = (localTheme === 'dark') ? 'dark' : 'light';
            localStorage.setItem('finsight_theme', theme);
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-rendered-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', Arial, Helvetica, sans-serif;
        }

        body{
            background: var(--bg-primary, #f4f6f9);
            color: var(--text-primary, #0f172a);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background: var(--card-bg, white);
            border: 1px solid var(--card-border, #e2e8f0);
            padding:35px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color: var(--text-primary, #2c3e50);
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color: var(--text-secondary, #777);
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .register-link{
            margin-top:20px;
            text-align:center;
        }

        .register-link a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Welcome Back</h2>

    <p>Login to Smart Finance Insights</p>

    {% if error %}
        <div style="background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('auth.register') }}">
            Register
        </a>

    </div>

</div>

</body>
</html>
