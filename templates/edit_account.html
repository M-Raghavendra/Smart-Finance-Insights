{% extends "layout.html" %}

{% block title %}
Edit Account
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}">
{% endblock %}

{% block page_title %}
Edit Account
{% endblock %}

{% block content %}

<div class="account-container">

    <div class="account-form">

        <h3>Edit Account</h3>

        <form method="POST">

            <div class="form-group">
                <label>Account Name</label>

                <input
                    type="text"
                    name="account_name"
                    value="{{ account.account_name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Account Type</label>

                <select name="account_type" required>

                    <option value="Bank" {% if account.account_type=="Bank" %}selected{% endif %}>Bank</option>

                    <option value="Cash" {% if account.account_type=="Cash" %}selected{% endif %}>Cash</option>

                    <option value="Credit Card" {% if account.account_type=="Credit Card" %}selected{% endif %}>Credit Card</option>

                    <option value="UPI / Wallet" {% if account.account_type=="UPI / Wallet" %}selected{% endif %}>UPI / Wallet</option>

                    <option value="Investment" {% if account.account_type=="Investment" %}selected{% endif %}>Investment</option>

                    <option value="Other" {% if account.account_type=="Other" %}selected{% endif %}>Other</option>

                </select>

            </div>

            <div class="form-group">
                <label>Current Balance</label>

                <input
                    type="number"
                    step="0.01"
                    name="balance"
                    value="{{ account.balance }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    name="description"
                    rows="4"
                >{{ account.description }}</textarea>

            </div>

            <button class="btn-save" type="submit">
                Update Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
