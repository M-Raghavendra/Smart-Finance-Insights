{% extends "layout.html" %}

{% block title %}
Edit Income
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/income.css') }}">
{% endblock %}

{% block page_title %}
Edit Income
{% endblock %}

{% block content %}

<div class="income-container">

    <div class="income-form">

        <h3>Edit Income</h3>

        <form method="POST">

            <div class="form-group">
                <label>Title</label>
                <input
                    type="text"
                    name="title"
                    value="{{ income.title }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Income Source</label>

                <select name="source" required>

                    <option value="Salary" {% if income.source=="Salary" %}selected{% endif %}>Salary</option>

                    <option value="Freelancing" {% if income.source=="Freelancing" %}selected{% endif %}>Freelancing</option>

                    <option value="Business" {% if income.source=="Business" %}selected{% endif %}>Business</option>

                    <option value="Investment" {% if income.source=="Investment" %}selected{% endif %}>Investment</option>

                    <option value="Bonus" {% if income.source=="Bonus" %}selected{% endif %}>Bonus</option>

                    <option value="Other" {% if income.source=="Other" %}selected{% endif %}>Other</option>

                </select>

            </div>

            <div class="form-group">
                <label>Amount</label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    value="{{ income.amount }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Date</label>

                <input
                    type="date"
                    name="income_date"
                    value="{{ income.income_date.strftime('%Y-%m-%d') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    name="description"
                    rows="4"
                >{{ income.description }}</textarea>

            </div>

            <button class="btn-save" type="submit">
                Update Income
            </button>

        </form>

    </div>

</div>

{% endblock %}
